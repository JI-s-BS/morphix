name: Printer report
description: Tried Morphix with your printer? Tell us what worked. This is how drivers go from "protocol" to "tested".
title: "Printer report: <brand> <model>"
labels: ["printer-report"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing! Only the Afinia QD330 has been tested on real hardware so far, so every report helps.
        **Never paste access codes, API keys or passwords.**
  - type: input
    id: printer
    attributes: { label: Printer, description: "Brand, model and firmware version", placeholder: "Bambu Lab P1S, firmware 01.08.00.00" }
    validations: { required: true }
  - type: input
    id: connection
    attributes: { label: Connection, description: "Driver / connection you picked on the setup page", placeholder: "bambu-lan (LAN mode)" }
    validations: { required: true }
  - type: checkboxes
    id: worked
    attributes:
      label: What worked
      options:
        - label: Test connection
        - label: Live status (temperatures, progress)
        - label: Upload a file
        - label: Start a print
        - label: Pause / resume
        - label: Cancel
        - label: Camera
        - label: A full print finished correctly
  - type: textarea
    id: details
    attributes: { label: What happened, description: "What didn't work, error messages (codes like MX-…), anything surprising" }
  - type: input
    id: version
    attributes: { label: Morphix version, description: "`morphix version`" }
  - type: textarea
    id: logs
    attributes: { label: Log excerpt (optional), description: "`morphix logs -n 200`. Check it for secrets before pasting.", render: text }
